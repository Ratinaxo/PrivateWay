# Ejecutar con: docker compose -f compose.yaml -f compose.dev.yaml up --build -d
# Desarrollo en localhost. Se mantiene la autenticación OIDC en todas las rutas.
services:
  frontend:
    build:
      target: development
    command: ["./node_modules/.bin/next", "dev", "-H", "0.0.0.0", "-p", "3000"]
    environment:
      NODE_ENV: development
    volumes:
      # Recarga de cambios en los componentes y rutas del frontend.
      # Si cambian package.json, lockfile o next.config.ts: reconstruir imagen.
      - ./frontend/src:/app/src:ro
    healthcheck:
      start_period: 100s
