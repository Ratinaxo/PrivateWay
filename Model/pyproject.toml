[project]
name = "privateway-model"
version = "0.1.0"
description = "Componentes locales de SLM y RAG de PrivateWay"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
