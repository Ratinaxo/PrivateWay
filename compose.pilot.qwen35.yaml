# Override exploratorio; Qwen3.5 requiere vLLM >= 0.17 según la receta oficial.
# Congelar el digest de imagen antes de la evaluación final.
services:
  slm:
    image: vllm/vllm-openai:v0.17.0@sha256:2296a2a7e1ce1dc59c6577ba5900f4e9910b76c4a0cb134833a8137f92404dfa
    command:
      - ${PRIVATEWAY_SLM_MODEL_DIR:-/models/qwen35}
      - --served-model-name=privateway-slm
      - --dtype=half
      - --quantization=${PRIVATEWAY_SLM_QUANTIZATION:-awq}
      - --language-model-only
      - --max-model-len=${PRIVATEWAY_SLM_CONTEXT:-4096}
      - --max-num-seqs=1
      - --max-num-batched-tokens=2048
      - --gpu-memory-utilization=${PRIVATEWAY_GPU_MEMORY:-0.75}
      - --enforce-eager
      - --swap-space=0
      - --no-enable-log-requests
      - --disable-uvicorn-access-log
      - --disable-log-stats
