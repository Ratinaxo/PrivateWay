services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: privateway-vllm
    restart: unless-stopped

    gpus: all
    shm_size: "1gb"

    ports:
      - "127.0.0.1:8001:8000"

    volumes:
      - vllm_models:/root/.cache/huggingface

    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"

    command:
      - --model
      - Qwen/Qwen2.5-3B-Instruct-AWQ

      - --served-model-name
      - privateway-slm

      - --quantization
      - awq

      - --dtype
      - half

      - --max-model-len
      - "2048"

      - --gpu-memory-utilization
      - "0.80"

      - --max-num-seqs
      - "1"

      - --enforce-eager
    networks:
      - private
      - default
volumes:
  vllm_models:

