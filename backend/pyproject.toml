[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ratinaxo", email = "ricardito_bastian@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography==48.0.1",
    "fastapi>=0.162.2",
    "httpx==0.28.1",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
